name: Release

on:
  push:
    tags:
      - "v*.*.*"

# 默认只读, 需要写权限的只有最后那个建 release 的 job
permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')

          echo "Git tag version:   $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Test
        run: cargo test --all-targets --locked

  build-linux-x86_64:
    name: Build Linux x86_64
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/icheck dist/icheck-linux-x86_64
          sha256sum dist/icheck-linux-x86_64 > dist/icheck-linux-x86_64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icheck-linux-x86_64
          path: dist/

  build-linux-arm64:
    name: Build Linux ARM64
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # 只装 Rust 的 std 不够: 链接阶段要一个能产出 ARM 可执行文件的链接器
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/icheck dist/icheck-linux-arm64
          sha256sum dist/icheck-linux-arm64 > dist/icheck-linux-arm64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icheck-linux-arm64
          path: dist/

  build-windows:
    name: Build Windows x86_64
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/icheck.exe dist/icheck-windows-x86_64.exe

          $hash = (Get-FileHash dist/icheck-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  icheck-windows-x86_64.exe" | Out-File -Encoding ascii dist/icheck-windows-x86_64.exe.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icheck-windows-x86_64
          path: dist/

  release:
    name: Create GitHub Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/icheck-linux-x86_64/*
            artifacts/icheck-linux-arm64/*
            artifacts/icheck-windows-x86_64/*